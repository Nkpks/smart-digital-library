<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="A Smart Digital Library for Data Science learning resources, projects, modules, and laboratory experiments.">

    <title>
        {% block title %}Smart Digital Library{% endblock %}
    </title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <script src="{{ url_for('static', filename='js/script.js') }}"
            defer></script>
</head>

<body>

    <header class="site-header">

        <div class="nav-container">

        <a href="{{ url_for('home') }}" class="brand">

            <span class="brand-icon">S</span>

            <span class="brand-text">
                Smart <span>Digital Library</span>
            </span>

        </a>

            <button class="menu-toggle"
                    id="menuToggle"
                    aria-label="Toggle navigation"
                    aria-expanded="false"
                    aria-controls="mainNavigation">

                <span></span>
                <span></span>
                <span></span>

            </button>

            <nav class="main-navigation" id="mainNavigation">

                <a href="{{ url_for('home') }}"
                class="{% if request.endpoint == 'home' %}active{% endif %}">
                    Home
                </a>

                <a href="{{ url_for('projects') }}"
                class="{% if request.endpoint == 'projects' %}active{% endif %}">
                    Projects
                </a>

                <a href="{{ url_for('modules') }}"
                class="{% if request.endpoint == 'modules' %}active{% endif %}">
                    Modules
                </a>

                <a href="{{ url_for('labs') }}"
                class="{% if request.endpoint == 'labs' %}active{% endif %}">
                    Lab Experiments
                </a>

                <a href="{{ url_for('tools') }}"
                class="{% if request.endpoint == 'tools' %}active{% endif %}">
                    Tools
                </a>

            </nav>

            <a href="{{ url_for('home') }}#profile"
               class="nav-profile">

                <span class="nav-profile-dot"></span>
                Student Profile

            </a>

        </div>

    </header>


    <main>

        {% block content %}{% endblock %}

    </main>


    <footer class="site-footer">

        <div class="footer-inner">

            <a href="{{ url_for('home') }}"
               class="footer-brand">
                DataVault
            </a>

            <p>
                A smarter way to learn Data Science.
            </p>

            <span>
                © {{ student.graduation_year if student else '2028' }}
                DataVault · Academic Learning Resource
            </span>

        </div>

    </footer>

</body>

</html>
<a href="{{ url_for('home') }}" class="footer-brand">
    Smart Digital Library
</a>
